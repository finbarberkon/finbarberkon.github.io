<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Finbar Berkon</title>
      <link rel="icon" href="/favicon.ico" sizes="any">
      <link rel="icon" type="image/png" href="/favicon.png">
      <link rel="apple-touch-icon" href="/apple-touch-icon.png">
      <style>
         body {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
            font-size: 1.125rem;
            line-height: 1.6;
         }
         main {
            width: 100%;
            max-width: 34rem;
         }
         h1 {
            margin: 0 0 0.75rem;
            font-size: 1.75rem;
            line-height: 1.2;
         }
         p {
            margin: 0 0 1rem;
         }
         a {
            color: #0b57d0;
            text-decoration: underline;
            text-underline-offset: 2px;
         }
         a:focus-visible {
            outline: 2px solid #111;
            outline-offset: 2px;
         }
      </style>
   </head>
   <body>
      <main>
         <h1>Finbar Berkon</h1>
         <p>I am a software engineer, photographer, and tinkerer.</p>
         <p>
            Check out <a href="/photomap/">my photo map</a>, a website showing the places I've been and the photos I've taken.
         </p>
      </main>
   </body>
</html>
